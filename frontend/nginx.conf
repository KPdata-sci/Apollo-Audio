server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html is ~170KB of inline CSS/JS; gzip takes it to a fraction of
    # that, which matters on a phone over Tailscale (especially via a relay).
    # text/html is always compressed once gzip is on.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json;

    # "no-cache" = the browser keeps its copy but revalidates every load,
    # getting a tiny 304 when unchanged — so repeat loads are fast, and a new
    # deploy shows up immediately instead of a stale cached page.
    add_header Cache-Control "no-cache" always;
}
